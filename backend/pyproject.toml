[tool.black]
line-length = 100
target-version = ["py38"]
extend-exclude = "alembic/versions"

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 (function call in argument default) is a false positive for FastAPI's
# Depends()/Query() pattern, which is specifically designed to be used this
# way - FastAPI resolves these once per route registration, not on every
# call. Ignoring it project-wide is standard practice for FastAPI codebases.
ignore = ["B008"]

[tool.ruff.lint.pyupgrade]
# Pydantic and SQLAlchemy evaluate type annotations at runtime, and on
# Python 3.8/3.9 `str | None` / `list[str]` are not valid at runtime. Keep
# typing.Optional / typing.List so the backend runs on Python 3.8+.
keep-runtime-typing = true

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra --cov=app --cov-report=term-missing"
testpaths = ["tests"]
